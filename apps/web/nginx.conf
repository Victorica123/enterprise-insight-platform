# 前端静态托管 + 后端反代：同源部署，免去 CORS 配置
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA hash 路由无需 fallback，但保留以兼容直接路径访问
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Agent Service：/agent/chat -> http://agent:8000/chat
    location /agent/ {
        proxy_pass http://agent:8000/;
        # 保留外部端口，后端的同源判断必须与浏览器 Origin 一致。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Media Service：/media/api/auth/login -> http://media:8081/api/auth/login
    location /media/ {
        proxy_pass http://media:8081/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        client_max_body_size 256m;
        proxy_read_timeout 300s;
    }
}
