name: quality

on:
  push:
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/agent-service/requirements.txt
      - run: pip install -r services/agent-service/requirements.txt
      - run: python -m unittest discover -s tests -q
        working-directory: services/agent-service
        env:
          LLM_ROUTER_ENABLED: "0"
      - run: python quality/agent-evals/evaluate_v6.py
        env:
          LLM_ROUTER_ENABLED: "0"
      - run: python -m unittest discover -s scripts/tests -q
      - run: python scripts/update_knowledge.py --check

  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -q test
        working-directory: services/media-service

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  localhost-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/agent-service/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: pip install -r services/agent-service/requirements.txt
      - run: python scripts/local_acceptance.py
