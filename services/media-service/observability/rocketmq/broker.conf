# RocketMQ broker 配置（压测用，P2）
# 关键：brokerIP1=127.0.0.1。
# broker 默认向 namesrv 注册自己的容器内网 IP（如 172.18.x.x），宿主机上的应用
# （mvn spring-boot:run）拿到该地址后无法连通 → 消息发送失败。compose 已把 10911/10909
# 映射到宿主机，故让 broker 对外通告 127.0.0.1，宿主机客户端经端口映射即可到达。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
