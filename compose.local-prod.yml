name: enterprise-insight-local-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_PROD_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: videoplatform
      MYSQL_USER: videoplatform
      MYSQL_PASSWORD: ${LOCAL_PROD_MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-lock-wait-timeout=10
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - local-prod-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-init:
    image: mysql:8.4
    restart: "no"
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${LOCAL_PROD_MYSQL_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mysql -h mysql -uroot -e "CREATE DATABASE IF NOT EXISTS agent_platform
        CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE DATABASE IF NOT EXISTS keycloak CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        GRANT ALL PRIVILEGES ON agent_platform.* TO 'videoplatform'@'%';
        GRANT ALL PRIVILEGES ON keycloak.* TO 'videoplatform'@'%'; FLUSH PRIVILEGES;"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:17379:6379"
    volumes:
      - local-prod-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      JAVA_OPT_EXT: -server -Xms256m -Xmx256m -Xmn128m
    command: sh mqnamesrv
    ports:
      - "127.0.0.1:19876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -server -Xms512m -Xmx512m -Xmn256m
    command: sh mqbroker -n rocketmq-namesrv:9876
    depends_on:
      - rocketmq-namesrv

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${LOCAL_PROD_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LOCAL_PROD_MINIO_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:${LOCAL_PROD_WEB_PORT:-18080}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - local-prod-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${LOCAL_PROD_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LOCAL_PROD_MINIO_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb -p local/video-platform || true;
      mc anonymous set none local/video-platform || true;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    logging: *default-logging
    command: start-dev --import-realm
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: videoplatform
      KC_DB_PASSWORD: ${LOCAL_PROD_MYSQL_PASSWORD}
      KC_HOSTNAME: http://127.0.0.1:18082
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LOCAL_PROD_KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - ./config/keycloak/enterprise-insight-realm.json:/opt/keycloak/data/import/enterprise-insight-realm.json:ro
    depends_on:
      mysql-init:
        condition: service_completed_successfully

  agent:
    build: ./services/agent-service
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENV: production
      AGENT_AUTH_MODE: jwt
      JWT_ALGORITHM: RS256
      JWT_JWKS_URL: http://media:8081/api/auth/jwks
      APP_JWT_ISSUER: enterprise-insight
      APP_JWT_AUDIENCE: enterprise-insight-api
      MEDIA_INGEST_SERVICE_TOKEN: ${LOCAL_PROD_MEDIA_SERVICE_TOKEN}
      AGENT_DATABASE_URL: mysql://videoplatform:${LOCAL_PROD_MYSQL_PASSWORD}@mysql:3306/agent_platform?charset=utf8mb4
      AGENT_REQUIRE_MYSQL: "1"
      RETENTION_ENABLED: "1"
      RETENTION_TRANSCRIPT_DAYS: "180"
      RETENTION_AUDIT_DAYS: "365"
      RETENTION_SCAN_INTERVAL_SECONDS: "3600"
      MODEL_EGRESS_POLICY: allowlist
      MODEL_EGRESS_ALLOWED_TENANTS: ${LOCAL_PROD_MODEL_EGRESS_ALLOWED_TENANTS:-}
      DEFAULT_ANSWER_MODE: ${LOCAL_PROD_DEFAULT_ANSWER_MODE:-local}
      RETRIEVER_MODE: ${LOCAL_PROD_RETRIEVER_MODE:-keyword}
      LLM_PROVIDER: ${LOCAL_PROD_LLM_PROVIDER:-deepseek}
      DEEPSEEK_BASE_URL: ${LOCAL_PROD_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${LOCAL_PROD_DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_API_KEY: ${LOCAL_PROD_DEEPSEEK_API_KEY:-}
      OPENAI_BASE_URL: ${LOCAL_PROD_OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${LOCAL_PROD_OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${LOCAL_PROD_OPENAI_API_KEY:-}
      LLM_ROUTER_ENABLED: ${LOCAL_PROD_LLM_ROUTER_ENABLED:-0}
      EMBEDDING_MODEL: ${LOCAL_PROD_EMBEDDING_MODEL:-}
      RERANKER_MODEL: ${LOCAL_PROD_RERANKER_MODEL:-}
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./runtime/local-prod/agent:/app/data
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

  media:
    build: ./services/media-service
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENV: production
      SPRING_PROFILES_ACTIVE: production
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/videoplatform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: videoplatform
      MYSQL_PASSWORD: ${LOCAL_PROD_MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      MEDIA_FLYWAY_BASELINE_ON_MIGRATE: ${MEDIA_FLYWAY_BASELINE_ON_MIGRATE:-false}
      APP_JWT_ALGORITHM: RS256
      APP_JWT_PRIVATE_KEY_PATH: /app/keys/platform-private.pem
      APP_JWT_PUBLIC_KEY_PATH: /app/keys/platform-public.pem
      APP_JWT_KEY_ID: platform-1
      APP_JWT_EXPIRATION_SECONDS: "300"
      APP_JWT_ISSUER: enterprise-insight
      APP_JWT_AUDIENCE: enterprise-insight-api
      APP_OIDC_ENABLED: "true"
      APP_OIDC_ISSUER_URI: http://127.0.0.1:18082/realms/enterprise-insight
      APP_OIDC_JWK_SET_URI: http://keycloak:8080/realms/enterprise-insight/protocol/openid-connect/certs
      APP_OIDC_AUDIENCE: enterprise-insight-web
      APP_LOCAL_AUTH_ENABLED: "false"
      APP_MODEL_EGRESS_POLICY: allowlist
      APP_MODEL_EGRESS_ALLOWED_TENANTS: ${LOCAL_PROD_MODEL_EGRESS_ALLOWED_TENANTS:-}
      APP_RETENTION_ENABLED: "true"
      APP_RETENTION_MEDIA_DAYS: "30"
      APP_RETENTION_TRANSCRIPT_DAYS: "180"
      APP_RETENTION_AUDIT_DAYS: "365"
      APP_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_MQ_ENABLED: "true"
      APP_MQ_CONSUMER_THREADS: ${LOCAL_PROD_WORKERS:-4}
      ROCKETMQ_NAMESERVER: rocketmq-namesrv:9876
      APP_STORAGE_TYPE: s3
      APP_STORAGE_BASE_PATH: /app/storage
      APP_STORAGE_S3_ENDPOINT: http://minio:9000
      APP_STORAGE_S3_PUBLIC_ENDPOINT: http://127.0.0.1:19000
      APP_STORAGE_S3_BUCKET: video-platform
      APP_STORAGE_S3_ACCESS_KEY: ${LOCAL_PROD_MINIO_ACCESS_KEY}
      APP_STORAGE_S3_SECRET_KEY: ${LOCAL_PROD_MINIO_SECRET_KEY}
      APP_AGENT_INTEGRATION_ENABLED: "true"
      AGENT_SERVICE_BASE_URL: http://agent:8000
      MEDIA_INGEST_SERVICE_TOKEN: ${LOCAL_PROD_MEDIA_SERVICE_TOKEN}
      APP_TRANSCRIPT_ENABLED: ${LOCAL_PROD_TRANSCRIPT_ENABLED:-false}
      APP_TRANSCRIPT_MOCK_DELAY_MS: ${LOCAL_PROD_TRANSCRIPT_DELAY_MS:-750}
      WHISPER_API_BASE_URL: ${LOCAL_PROD_WHISPER_API_BASE_URL:-https://api.siliconflow.cn/v1}
      WHISPER_API_KEY: ${LOCAL_PROD_WHISPER_API_KEY:-}
      WHISPER_MODEL: ${LOCAL_PROD_WHISPER_MODEL:-iic/SenseVoiceSmall}
      FFMPEG_PATH: ${LOCAL_PROD_FFMPEG_PATH:-ffmpeg}
      APP_SUMMARY_ENABLED: ${LOCAL_PROD_SUMMARY_ENABLED:-false}
      LLM_API_BASE_URL: ${LOCAL_PROD_SUMMARY_API_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LOCAL_PROD_SUMMARY_API_KEY:-}
      LLM_MODEL: ${LOCAL_PROD_SUMMARY_MODEL:-deepseek-chat}
      APP_MAX_ACTIVE_TASKS_PER_USER: ${LOCAL_PROD_MAX_ACTIVE_TASKS_PER_USER:-0}
      APP_WORKFLOW_STALE_TASK_TIMEOUT: ${LOCAL_PROD_STALE_TASK_TIMEOUT:-2m}
      APP_WORKFLOW_TASK_LEASE_DURATION: ${LOCAL_PROD_TASK_LEASE_DURATION:-30s}
      APP_WORKFLOW_REAPER_INTERVAL_MS: "5000"
      APP_WORKFLOW_REAPER_INITIAL_DELAY_MS: "5000"
      APP_WORKFLOW_DISPATCH_INTERVAL_MS: "100"
      JAVA_TOOL_OPTIONS: >-
        -Xms256m -Xmx768m -XX:+UnlockDiagnosticVMOptions -XX:NativeMemoryTracking=summary -XX:+PrintNMTStatistics
        -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/diagnostics
        -XX:StartFlightRecording=filename=/app/diagnostics/media.jfr,settings=profile,disk=true,dumponexit=true,maxage=30m,maxsize=256m
    ports:
      - "127.0.0.1:18081:8081"
    volumes:
      - ./runtime/local-prod/media/storage:/app/storage
      - ./runtime/local-prod/diagnostics:/app/diagnostics
      - ./runtime/local-prod/keys:/app/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: /agent
        VITE_MEDIA_API_BASE_URL: /media
        VITE_OIDC_ENABLED: "true"
        VITE_OIDC_ISSUER: http://127.0.0.1:18082/realms/enterprise-insight
        VITE_OIDC_CLIENT_ID: enterprise-insight-web
        VITE_LOCAL_AUTH_ENABLED: "false"
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${LOCAL_PROD_WEB_PORT:-18080}:80"
    depends_on:
      agent:
        condition: service_healthy
      media:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [observability]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./quality/observability/prometheus.local-prod.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      media:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [observability]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${LOCAL_PROD_GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - local-prod-grafana:/var/lib/grafana
      - ./services/media-service/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/media-service/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  local-prod-mysql:
  local-prod-redis:
  local-prod-minio:
  local-prod-grafana:
