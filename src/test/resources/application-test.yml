# 测试专用配置：强制 H2 内存库，关闭 Redis/MQ/Docker-Compose，使测试自洽、不依赖外部服务
spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:videoplatform;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  redis:
    enabled: false
  mq:
    enabled: false
