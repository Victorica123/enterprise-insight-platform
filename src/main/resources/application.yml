server:
  port: 8080

spring:
  application:
    name: video-platform
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

rocketmq:
  nameServer: localhost:9876
  producer:
    group: video-platform-producer
    send-message-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: 01234567890123456789012345678901
    expiration-seconds: 86400
  storage:
    base-path: storage
  redis:
    enabled: true
  mq:
    enabled: false
  transcript:
    enabled: false
    whisper:
      # OpenAI-compatible base URL, example: https://api.openai.com/v1
      api-base-url: ""
      # Your API key
      api-key: ""
      # Whisper model name
      model: whisper-1
      # ffmpeg executable path. Keep "ffmpeg" if PATH is configured.
      ffmpeg-path: ffmpeg
  summary:
    enabled: false
    llm:
      # OpenAI-compatible base URL, example: https://api.openai.com/v1
      api-base-url: ""
      # Your API key
      api-key: ""
      # Chat model name
      model: gpt-4o-mini
      # Optional system prompt for summary behavior
      system-prompt: 请将以下视频转写内容总结为3-5条要点，并给出一个简短结论。
