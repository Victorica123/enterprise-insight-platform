server:
  port: 8081

spring:
  application:
    name: video-platform
  docker:
    compose:
      enabled: true
      lifecycle-management: start_only
      profiles:
        active: mysql
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # 宿主机 6379 在本机被系统保留无法绑定，docker-compose 将 redis 暴露在 7379
      port: ${REDIS_PORT:7379}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  # ===== 默认使用 MySQL（Spring Boot 启动时由 docker-compose 自动拉起 mysql 容器）=====
  # 零依赖本地开发可用 H2：-Dspring-boot.run.profiles=h2（见文件末尾 h2 profile）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:videoplatform}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

rocketmq:
  nameServer: localhost:9876
  producer:
    group: video-platform-producer
    send-message-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${APP_JWT_SECRET:01234567890123456789012345678901}
    expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:86400}
  storage:
    base-path: ${APP_STORAGE_BASE_PATH:./storage}
  redis:
    enabled: ${APP_REDIS_ENABLED:true}
  mq:
    enabled: ${APP_MQ_ENABLED:false}
  transcript:
    enabled: ${APP_TRANSCRIPT_ENABLED:false}
    whisper:
      # 硅基流动 API: https://api.siliconflow.cn/v1
      api-base-url: ${WHISPER_API_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${WHISPER_API_KEY:}
      model: ${WHISPER_MODEL:iic/SenseVoiceSmall}
      ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  summary:
    enabled: ${APP_SUMMARY_ENABLED:false}
    llm:
      # DeepSeek API: https://api.deepseek.com/v1
      api-base-url: ${LLM_API_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:deepseek-chat}
      system-prompt: 请将以下视频转写内容总结为3-5条要点，并给出一个简短结论。

---
# ===== 零依赖本地开发：H2 内存库 + 关闭 Redis/MQ/Docker（-Dspring-boot.run.profiles=h2）=====
spring:
  config:
    activate:
      on-profile: h2
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:videoplatform;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
app:
  redis:
    enabled: false
  mq:
    enabled: false
